name: release

# Builds a standalone binary per platform and publishes them to a GitHub release, plus the npm
# package for `npx`. Binaries are built from official nodejs.org builds: distro-packaged node is
# often stripped and lacks the SEA sentinel fuse postject needs.

on:
  push:
    tags: ['v*']
  # Lets the publish be retried without cutting a new tag.
  workflow_dispatch:

env:
  NODE_VERSION: '20.18.1'

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        # No Windows binary yet; see the note in ci.yml. install.ps1 stays in the repository so the
        # platform can be restored by adding the runner back here.
        include:
          - { runner: ubuntu-latest, target_os: linux, arch: x64, node_arch: linux-x64 }
          - { runner: ubuntu-24.04-arm, target_os: linux, arch: arm64, node_arch: linux-arm64 }
          # Built on Apple Silicon rather than a macos-13 runner: GitHub's Intel images are being
          # retired and jobs sit queued. The binary is the official darwin-x64 Node with the blob
          # injected, and codesign signs a foreign-architecture Mach-O without complaint.
          - { runner: macos-14, target_os: darwin, arch: x64, node_arch: darwin-x64 }
          - { runner: macos-14, target_os: darwin, arch: arm64, node_arch: darwin-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run brand:check
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

      - name: Fetch the official Node binary to embed
        shell: bash
        run: |
          set -euo pipefail
          base="https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-${{ matrix.node_arch }}"
          if [ "${{ matrix.target_os }}" = "win32" ]; then
            curl -fsSL "$base.zip" -o node.zip
            unzip -q node.zip
            echo "NODE_BIN=$(pwd)/node-v${NODE_VERSION}-${{ matrix.node_arch }}/node.exe" >> "$GITHUB_ENV"
          else
            curl -fsSL "$base.tar.xz" -o node.tar.xz
            tar xf node.tar.xz
            echo "NODE_BIN=$(pwd)/node-v${NODE_VERSION}-${{ matrix.node_arch }}/bin/node" >> "$GITHUB_ENV"
          fi

      - name: Build the binary
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: node scripts/build-binary.mjs --node "$NODE_BIN" --target-os ${{ matrix.target_os }}

      # The binaries are deliberately not signed with a Developer ID or an Authenticode
      # certificate. macOS binaries are ad-hoc signed by scripts/build-binary.mjs, which is what
      # Apple Silicon requires to execute them at all; see README -> Unsigned binaries for what
      # that means for people who download from a browser rather than the install script.

      - name: Smoke-test the binary
        shell: bash
        run: |
          bin=$(ls bin/* | head -1)
          "$bin" --version
          "$bin" formats > /dev/null
          "$bin" deps test/fixtures/sample-project

      - name: Compress and name the asset
        shell: bash
        run: |
          set -euo pipefail
          src=$(ls bin/* | head -1)
          name="$(node -p "require('./brand.config.json').binaryName")-${{ matrix.target_os }}-${{ matrix.arch }}"
          if [ "${{ matrix.target_os }}" = "win32" ]; then name="$name.exe"; fi
          gzip -9 -c "$src" > "$name.gz"
          if command -v sha256sum >/dev/null; then sha256sum "$name.gz" > "$name.gz.sha256"; else shasum -a 256 "$name.gz" > "$name.gz.sha256"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target_os }}-${{ matrix.arch }}
          path: |
            *.gz
            *.sha256

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { path: assets, merge-multiple: true }

      - name: Collect checksums
        run: cat assets/*.sha256 | sed 's|assets/||' > assets/SHA256SUMS

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/*.gz
            assets/SHA256SUMS
          generate_release_notes: true

      # The npm error is surfaced as a workflow annotation as well as in the log, because job logs
      # need admin rights to read while annotations do not.
      - name: Publish to npm (enables npx)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Booleans only: whether GitHub has the secret at all, and its length. Never the value.
          SECRET_PRESENT: ${{ secrets.NPM_TOKEN != '' }}
          SECRETS_CONTEXT_WORKS: ${{ secrets.GITHUB_TOKEN != '' }}
        run: |
          set -o pipefail

          echo "::notice title=secret check::NPM_TOKEN present=${SECRET_PRESENT} length=${#NODE_AUTH_TOKEN} secrets-context-works=${SECRETS_CONTEXT_WORKS} repo=${{ github.repository }} ref=${{ github.ref }}"

          if [ -z "$NODE_AUTH_TOKEN" ]; then
            # On a tag this is a failed release, not a skipped step: reporting success would leave a
            # version tagged and released on GitHub but absent from the registry.
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "::error title=npm publish failed::NPM_TOKEN is empty or missing. Check Settings > Secrets and variables > Actions > Repository secrets."
              exit 1
            fi
            echo "::warning title=npm skipped::NPM_TOKEN is not set"
            exit 0
          fi

          identity=$(npm whoami 2>&1 || true)
          echo "::notice title=npm identity::$identity"

          if npm publish --provenance --access public 2>&1 | tee /tmp/npm-publish.log; then
            echo "::notice title=npm published::$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
            exit 0
          fi

          # Collapse the error to one line so it survives as an annotation.
          reason=$(grep -aE "npm (error|ERR!)" /tmp/npm-publish.log | head -12 | tr '\n' ' ' | cut -c1-800)
          echo "::error title=npm publish failed::${reason:-see the job log}"
          exit 1
