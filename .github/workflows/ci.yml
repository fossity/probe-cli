name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is disabled: the scanoss winnowing engine writes the scanned path into the WFP
        # without normalising separators, so a scan run on Windows emits backslash paths and the
        # obfuscation stage cannot match them. Re-add windows-latest once that is fixed.
        os: [ubuntu-latest, macos-latest]
        node: ['18', '20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run brand:check
      - run: npm run typecheck
      - run: npm run format:check
      # The suite builds the bundle and spawns it, so this also covers the artifact npx installs.
      - run: npm test
      # The bundle is named after the binary, so read the name rather than repeating it.
      - run: node "$(node -p "Object.values(require('./package.json').bin)[0]")" formats
        shell: bash
