name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run brand:check
      - run: npm run typecheck
      - run: npm run format:check
      # The suite builds the bundle and spawns it, so this also covers the artifact npx installs.
      - run: npm test
      # The bundle is named after the binary, so read the name rather than repeating it.
      - run: node "$(node -p "Object.values(require('./package.json').bin)[0]")" formats
        shell: bash
